[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-agent"
version = "0.1.0"
description = "LangGraph skeleton for Chinese ink painting companionship and creation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ink-agent = "ink_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

